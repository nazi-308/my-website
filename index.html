<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Enhancer</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--line:#30363d;--txt:#e6edf3;--mut:#8b949e;--acc:#2ea043;--acc2:#1f6feb}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--txt)}
header{padding:18px 14px;background:linear-gradient(135deg,#1f6feb,#2ea043)}
header h1{margin:0;font-size:22px}
header p{margin:4px 0 0;font-size:13px;opacity:.9}
main{max-width:640px;margin:auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
canvas{width:100%;border-radius:8px;background:#0a0d12;display:block}
.drop{display:block;text-align:center;padding:18px;border:2px dashed var(--line);border-radius:10px;color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap}
button,select{padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:#21262d;color:var(--txt);font-size:14px}
button.p{background:var(--acc);border-color:var(--acc)}
button.on{background:var(--acc2);border-color:var(--acc2)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chips button{white-space:nowrap}
.s{margin-top:10px}
.s div{display:flex;justify-content:space-between;font-size:14px}
.s span{color:var(--mut)}
input[type=range]{width:100%}
#info{font-size:13px;color:var(--mut);margin-top:8px}
</style>
</head>
<body>
<header>
  <h1>📷 Photo Enhancer</h1>
  <p>Free and open source. Runs in your browser, photos never leave your phone.</p>
</header>
<main>
  <div class="card">
    <label class="drop" id="dropLabel" for="file">📁 Tap to choose a photo</label>
    <input type="file" id="file" accept="image/*" hidden>
  </div>

  <div class="card">
    <canvas id="c"></canvas>
    <div id="info">No photo yet</div>
    <div class="row" style="margin-top:8px">
      <button id="rot">⟳ Rotate</button>
      <button id="flip">⇋ Flip</button>
      <button id="cmp">👁 Hold to compare</button>
    </div>
  </div>

  <div class="card"><h2>Presets</h2><div class="chips" id="presets"></div></div>
  <div class="card"><h2>Adjust</h2><div id="sliders"></div></div>

  <div class="card">
    <h2>Export</h2>
    <div class="row">
      <button id="m1" class="on">Original</button>
      <button id="m2">2x</button>
      <button id="m4">4K</button>
      <select id="fmt">
        <option value="image/png">PNG</option>
        <option value="image/jpeg">JPG</option>
      </select>
    </div>
    <button id="save" class="p" style="margin-top:10px;width:100%">Download</button>
  </div>
</main>

<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
let img = null, mode = 'original', rot = 0, flip = false, cmp = false;

const S = [
  ['brightness','Brightness',50,150,100],
  ['contrast','Contrast',50,150,100],
  ['saturate','Saturation',0,200,100],
  ['hue','Hue',0,360,0],
  ['grayscale','Grayscale',0,100,0],
  ['sepia','Sepia',0,100,0],
  ['blur','Blur',0,10,0],
  ['sharpen','Sharpen',0,5,0]
];
const val = id => +document.getElementById(id).value;

S.forEach(([id,label,min,max,def]) => {
  const d = document.createElement('div');
  d.className = 's';
  d.innerHTML = `<div>${label}<span id="${id}V">${def}</span></div><input type="range" id="${id}" min="${min}" max="${max}" value="${def}">`;
  document.getElementById('sliders').appendChild(d);
  document.getElementById(id).oninput = () => {
    document.getElementById(id + 'V').textContent = val(id);
    draw();
  };
});

const presets = {
  'Original': {},
  'Vivid': {contrast:115, saturate:140},
  'B&W': {grayscale:100, contrast:110},
  'Vintage': {sepia:60, contrast:90, brightness:105},
  'Soft': {blur:1, brightness:105, contrast:95},
  'Crisp': {sharpen:3, contrast:110},
  'Dramatic': {contrast:130, saturate:120, brightness:90}
};
Object.keys(presets).forEach(name => {
  const b = document.createElement('button');
  b.textContent = name;
  b.onclick = () => applyPreset(presets[name]);
  document.getElementById('presets').appendChild(b);
});
function applyPreset(p) {
  S.forEach(([id,,,,def]) => {
    const v = p[id] !== undefined ? p[id] : def;
    document.getElementById(id).value = v;
    document.getElementById(id + 'V').textContent = v;
  });
  draw();
}

function filterStr(s) {
  return `brightness(${val('brightness')}%) contrast(${val('contrast')}%) saturate(${val('saturate')}%) hue-rotate(${val('hue')}deg) grayscale(${val('grayscale')}%) sepia(${val('sepia')}%) blur(${val('blur') * s}px)`;
}

function sharpen(cx, w, h, a) {
  const d = cx.getImageData(0, 0, w, h);
  const src = new Uint8ClampedArray(d.data);
  const o = d.data, k = a * 0.5, w4 = w * 4;
  for (let y = 1; y < h - 1; y++) {
    for (let x = 1; x < w - 1; x++) {
      for (let ch = 0; ch < 3; ch++) {
        const i = (y * w + x) * 4 + ch;
        o[i] = src[i] * (1 + 4 * k) - k * (src[i - 4] + src[i + 4] + src[i - w4] + src[i + w4]);
      }
    }
  }
  cx.putImageData(d, 0, 0);
}

function render(cv, s, filters) {
  const cw = Math.round(img.width * s), ch = Math.round(img.height * s);
  const odd = rot % 2;
  cv.width = odd ? ch : cw;
  cv.height = odd ? cw : ch;
  const x = cv.getContext('2d');
  x.imageSmoothingEnabled = true;
  x.imageSmoothingQuality = 'high';
  x.filter = filters ? filterStr(s) : 'none';
  x.save();
  x.translate(cv.width / 2, cv.height / 2);
  x.rotate(rot * Math.PI / 2);
  x.scale(flip ? -1 : 1, 1);
  x.drawImage(img, -cw / 2, -ch / 2, cw, ch);
  x.restore();
  x.filter = 'none';
  if (filters && val('sharpen') > 0) sharpen(x, cv.width, cv.height, val('sharpen'));
}

const previewScale = () => Math.min(1, 900 / Math.max(img.width, img.height));
const outScale = () => mode === '2x' ? 2 : mode === '4k' ? 3840 / Math.max(img.width, img.height) : 1;

function draw() {
  if (!img) return;
  render(c, previewScale(), !cmp);
  const s = outScale(), odd = rot % 2;
  const w = Math.round(img.width * s), h = Math.round(img.height * s);
  document.getElementById('info').textContent = 'Export size: ' + (odd ? h : w) + ' × ' + (odd ? w : h);
}

document.getElementById('file').onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  document.getElementById('dropLabel').textContent = '✅ ' + f.name;
  img = new Image();
  img.onload = draw;
  img.src = URL.createObjectURL(f);
};

document.getElementById('rot').onclick = () => { rot = (rot + 1) % 4; draw(); };
document.getElementById('flip').onclick = () => { flip = !flip; draw(); };

const cb = document.getElementById('cmp');
cb.oncontextmenu = () => false;
['pointerdown'].forEach(ev => cb.addEventListener(ev, () => { cmp = true; draw(); }));
['pointerup','pointerleave','pointercancel'].forEach(ev => cb.addEventListener(ev, () => { cmp = false; draw(); }));

function setMode(m, id) {
  mode = m;
  ['m1','m2','m4'].forEach(i => document.getElementById(i).classList.remove('on'));
  document.getElementById(id).classList.add('on');
  draw();
}
document.getElementById('m1').onclick = () => setMode('original', 'm1');
document.getElementById('m2').onclick = () => setMode('2x', 'm2');
document.getElementById('m4').onclick = () => setMode('4k', 'm4');

const save = document.getElementById('save');
save.onclick = () => {
  if (!img) return;
  save.textContent = 'Working...';
  setTimeout(() => {
    const out = document.createElement('canvas');
    render(out, outScale(), true);
    const type = document.getElementById('fmt').value;
    out.toBlob(b => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = 'enhanced.' + (type === 'image/png' ? 'png' : 'jpg');
      a.click();
      save.textContent = 'Download';
    }, type, 0.92);
  }, 50);
};
</script>
</body>
</html>
